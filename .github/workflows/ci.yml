name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (lint, types, migrations, tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test -d test_db"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      ENV: test
      DATABASE_URL: postgresql://test:test@localhost:5432/test_db
      TEST_DATABASE_URL: postgresql://test:test@localhost:5432/test_db
      SECRET_KEY: ci-only-secret-key-not-for-production
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: "30"
      REFRESH_TOKEN_EXPIRE_DAYS: "7"
      FRONTEND_URL: http://localhost:5173
      ALLOWED_ORIGINS: '["http://localhost:5173"]'
      GOOGLE_CLIENT_ID: ci-client-id
      GOOGLE_CLIENT_SECRET: ci-client-secret
      GOOGLE_REDIRECT_URI: http://localhost:8000/api/v1/auth/google/callback
      SCAN_WORKDIR: /tmp/project-verification
      SCAN_CLONE_TIMEOUT_SECONDS: "60"
      SCAN_MAX_REPO_SIZE_MB: "200"
      SCAN_MAX_FILES: "50000"
      SCAN_TOTAL_TIMEOUT_SECONDS: "120"
      SCAN_CONCURRENCY: "2"
      SCAN_MAX_QUEUED: "20"
      SCANS_PER_HOUR_PER_USER: "10"
      MAX_PROJECTS_PER_USER: "50"
      GITHUB_TOKEN: ""
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Verify git is available (scanner clones repos)
        run: git --version

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Ruff
        run: ruff check .

      - name: Mypy
        run: mypy app

      - name: Alembic migrations (upgrade, round-trip, model drift check)
        run: |
          alembic upgrade head
          alembic downgrade base
          alembic upgrade head
          alembic check

      - name: Pytest with coverage
        run: pytest --cov=app --cov-report=term-missing --cov-fail-under=80

  frontend:
    name: Frontend (lint, types, tests, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run type-check

      - name: Unit tests
        run: npm test -- --run

      - name: Build
        run: npm run build
        env:
          VITE_API_URL: http://localhost:8000

  docker:
    name: Docker images build
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    env:
      # docker-compose.yml requires SECRET_KEY (${SECRET_KEY:?}); build-only dummy value.
      SECRET_KEY: ci-docker-build-only-not-a-real-secret-0123456789abcdef
    steps:
      - uses: actions/checkout@v4

      - name: Create .env from example
        run: cp .env.example .env

      - name: Validate compose files
        run: |
          docker compose config -q
          docker compose -f docker-compose.dev.yml config -q

      - name: Build images
        run: docker compose build
