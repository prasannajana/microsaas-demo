# nginx server config for the SPA. This file is an envsubst TEMPLATE: the Dockerfile
# copies it to /etc/nginx/templates/default.conf.template and the nginx image renders
# it into /etc/nginx/conf.d/default.conf at container start. Only variables that exist
# in the environment are substituted (API_ORIGIN), so nginx's own $uri etc. are kept.
# Runs on nginxinc/nginx-unprivileged (non-root), hence port 8080.
server {
    listen 8080;
    listen [::]:8080;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;
    gzip_min_length 1024;

    # add_header in a location block replaces server-level headers, so every
    # location includes the same security-header snippet.
    include /etc/nginx/conf.d/security-headers.inc;

    # Fingerprinted build assets: cache aggressively.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        include /etc/nginx/conf.d/security-headers.inc;
        try_files $uri =404;
    }

    # Never cache the SPA shell.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        include /etc/nginx/conf.d/security-headers.inc;
    }

    # SPA fallback: client-side routes resolve to index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
